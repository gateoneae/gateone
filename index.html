<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gateone — Founder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --white:#ffffff; --black:#0c0c0d; --gold:#b8912f; --teal:#0e7c78; --teal-l:#4fcfc4;
  --paper:#fbfaf7; --card:#ffffff; --ink:#0c0c0d; --muted:#6b6b68; --line:#e3e0d8;
  --r-sm:12px; --r-md:18px; --r-lg:28px; --r-xl:36px;
  --sh-1:0 1px 2px rgba(12,12,13,.06); --sh-2:0 12px 32px -14px rgba(12,12,13,.22);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --paper:#0c0c0d; --card:#17181a; --ink:#f6f5f1; --muted:#a19f96; --line:#2b2c2d;
    --gold:#e8cf8f; --teal:#4fcfc4; --sh-1:0 1px 2px rgba(0,0,0,.5); --sh-2:0 12px 32px -14px rgba(0,0,0,.6); }
}
:root[data-theme="dark"]{ --paper:#0c0c0d; --card:#17181a; --ink:#f6f5f1; --muted:#a19f96; --line:#2b2c2d;
  --gold:#e8cf8f; --teal:#4fcfc4; --sh-1:0 1px 2px rgba(0,0,0,.5); --sh-2:0 12px 32px -14px rgba(0,0,0,.6); }
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:500 17px/1.5 "Manrope",system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.disp{font-family:"Fraunces",serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px clamp(16px,3vw,32px) 60px}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 28px}
.brand{font-family:"Fraunces",serif;font-weight:700;font-size:24px}
.brand span{color:var(--muted);font-family:"Manrope",sans-serif;font-weight:600;font-size:15px;margin-left:10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:11px 18px;font-weight:700;box-shadow:var(--sh-1)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.5}
.iconbtn{width:44px;height:44px;border-radius:99px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;box-shadow:var(--sh-1)}
.iconbtn svg{width:19px;height:19px}
.topbtns{display:flex;gap:10px;align-items:center}
.center{min-height:80vh;display:grid;place-content:center;justify-items:center;text-align:center;gap:14px;padding:20px}
.loginbox{max-width:380px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;box-shadow:var(--sh-2)}
.field{margin-bottom:14px;text-align:left}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input{width:100%;height:50px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--paper)}
.warn{color:var(--gold);font-weight:700}
.spinner{width:40px;height:40px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--teal);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gatesgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:18px}
.gatecard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-1);cursor:pointer;text-align:left;transition:transform .1s,box-shadow .1s}
.gatecard:hover{box-shadow:var(--sh-2);transform:translateY(-2px)}
.gatecard:active{transform:translateY(0);box-shadow:var(--sh-1)}
.gatecard .viewhint{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:13px;font-weight:800;color:var(--white);background:var(--teal);padding:9px 14px;border-radius:99px}
.alertbar{border-radius:var(--r-lg);padding:16px 20px;margin-bottom:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:12px}
.alertbar.ok{background:var(--card);border:1px solid var(--line);color:var(--muted)}
.alertbar.bad{background:var(--black);color:var(--white);border:1px solid var(--black)}
.alertrow{display:grid;grid-template-columns:170px 70px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:start}
.alertrow:last-child{border-bottom:0}
.alertrow .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.alertrow .dot.ok{background:var(--teal)}
.alertrow .dot.bad{background:var(--black)}
.alertrow .status{display:flex;align-items:center;gap:7px;font-weight:700}
.demobtn{width:100%;text-align:left;padding:16px 20px;border-radius:var(--r-lg);border:1px solid var(--gold);background:var(--card);font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:12px}
.demobtn.on{background:var(--gold);color:var(--black);border-color:var(--gold)}
.tip{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:18px;font-size:14px;color:var(--muted)}
.tip button{background:none;border:0;font-size:18px;line-height:1;color:var(--muted);flex:none;padding:0 2px}
.gatecard h3{margin:0 0 4px;font-family:"Fraunces",serif;font-weight:600;font-size:20px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;margin-bottom:10px}
.tag.premium{background:var(--gold);color:var(--black)}
.tag.basic{background:var(--teal);color:var(--white)}
.gatestats{display:flex;gap:16px;margin-top:10px}
.gatestats b{display:block;font-size:22px;font-family:"Fraunces",serif}
.gatestats span{font-size:12px;color:var(--muted);font-weight:700}
.addcard{border:2px dashed var(--line);background:transparent;box-shadow:none;display:grid;place-content:center;min-height:120px;font-weight:700;color:var(--muted)}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:8px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-1)}
.tcard b{display:block;font-size:32px;font-family:"Fraunces",serif;color:var(--teal)}
.tcard span{font-size:13px;color:var(--muted);font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:20px;box-shadow:var(--sh-1)}
.panel h3{margin:0 0 13px;font-size:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:50;padding:20px}
.modalbox{background:var(--card);border-radius:var(--r-lg);padding:26px;max-width:420px;width:100%;box-shadow:var(--sh-2)}
.code{font-family:"Fraunces",serif;font-size:36px;letter-spacing:.1em;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:18px;margin:14px 0}
.demorow{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--card);border:1px solid var(--gold);border-radius:var(--r-lg);padding:16px 20px;margin-bottom:18px}
.toggle{position:relative;width:52px;height:30px;border-radius:99px;background:var(--line);border:0;flex:none}
.toggle i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--white);box-shadow:var(--sh-1);transition:transform .15s}
.toggle[aria-pressed="true"]{background:var(--gold)}
.toggle[aria-pressed="true"] i{transform:translateX(22px)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:700;font-size:12px;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line)}
.small{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPA_URL = 'https://njkwjelntinfmutoavez.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qa3dqZWxudGluZm11dG9hdmV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5OTc1NTksImV4cCI6MjEwNTU3MzU1OX0.mxA3Q9zaPKXTI-CsZEcYjnJ44k3Rb3YEMWatS-YbAZM';
const sb = supabase.createClient(SUPA_URL, SUPA_ANON);

const S = { screen: 'loading', email: '', password: '', showPw: false, loginErr: '', gates: [], selected: null, detail: null, saving: false, modal: null, theme: loadTheme(), health: [], lastAlertedId: null, showTip: !tipSeen(), searchdate: '', renamevalue: '', deleteconfirm: '' };
let autoRefreshTimer = null, healthTimer = null;
function loadTheme() { try { return localStorage.getItem('founder_theme') || 'auto'; } catch (e) { return 'auto'; } }
function tipSeen() { try { return localStorage.getItem('founder_tip_seen') === '1'; } catch (e) { return true; } }
function applyTheme() { if (S.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme); }
const ICONS = {
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>'
};
function themeBtn() { return `<button class="iconbtn" data-act="theme" aria-label="Theme">${S.theme === 'dark' ? ICONS.sun : ICONS.moon}</button>`; }
function healthBanner() {
  const latest = S.health[0];
  if (!latest) return '';
  if (latest.ok) return `<div class="alertbar ok"><span>✓ Last automatic check passed, ${new Date(latest.checked_at).toLocaleString([], { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' })}</span></div>`;
  return `<div class="alertbar bad"><span>⚠ Something failed on the last automatic check: ${esc(latest.detail)}</span></div>`;
}
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function maskId(d) { return d && d.length >= 4 ? '•••• ' + d.slice(-4) : (d || ''); }
function parseSearchDate(q) {
  if (!q || !q.trim()) return null;
  const s = q.trim();
  const hasYear = /\b(19|20)\d{2}\b/.test(s);
  let d = new Date(hasYear ? s : s + ' ' + new Date().getFullYear());
  if (isNaN(d.getTime())) d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
function sameDay(ts, d) { const a = new Date(ts); return a.getFullYear() === d.getFullYear() && a.getMonth() === d.getMonth() && a.getDate() === d.getDate(); }
function render() { applyTheme(); $('#app').innerHTML = VIEWS[S.screen](); }

async function boot() {
  await sb.auth.signOut(); // this is the owner-only panel: always require a fresh sign-in, never stay logged in across reloads
  S.screen = 'login'; render();
}
async function checkOwnerAndLoad() {
  S.screen = 'loading'; render();
  const { data: ud, error: ue } = await sb.auth.getUser();
  if (ue || !ud || !ud.user) { S.loginErr = 'Could not verify the login: ' + (ue ? ue.message : 'no user returned') + '. Try again.'; await sb.auth.signOut(); S.screen = 'login'; render(); return; }
  const { data: mgr, error: me } = await sb.from('managers').select('is_owner').eq('id', ud.user.id).maybeSingle();
  if (me) { S.loginErr = 'Could not check owner access: ' + me.message; await sb.auth.signOut(); S.screen = 'login'; render(); return; }
  if (!mgr || !mgr.is_owner) { S.loginErr = 'This account is not set up as the Gateone owner.'; await sb.auth.signOut(); S.screen = 'login'; render(); return; }
  await loadGates();
  await loadHealth();
  startTimers();
  S.screen = 'list'; render();
}
function startTimers() {
  stopTimers();
  autoRefreshTimer = setInterval(async () => { await loadGates(); if (S.screen === 'list') render(); }, 45000);
  healthTimer = setInterval(loadHealth, 5 * 60000);
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
}
function stopTimers() { clearInterval(autoRefreshTimer); clearInterval(healthTimer); autoRefreshTimer = null; healthTimer = null; }
async function loadHealth() {
  const { data, error } = await sb.rpc('get_health_history', { n: 10 });
  if (error) return;
  S.health = data || [];
  const latest = S.health[0];
  if (latest && !latest.ok && S.lastAlertedId !== latest.id) {
    S.lastAlertedId = latest.id;
    if ('Notification' in window && Notification.permission === 'granted') {
      try { new Notification('Gateone: something failed', { body: latest.detail }); } catch (e) {}
    }
  }
  if (['list', 'detail'].includes(S.screen)) render();
}
async function loadGates() {
  const { data, error } = await sb.rpc('owner_gate_summary');
  if (error) { alert('Could not load gates: ' + error.message); S.gates = []; return; }
  S.gates = data;
}

const VIEWS = {
  loading: () => `<div class="center"><div class="spinner"></div></div>`,

  login: () => `<div class="center"><div class="loginbox">
    <p class="brand disp" style="margin:0 0 6px">Gateone</p>
    <p class="small" style="margin:0 0 20px">Founder sign in</p>
    <div class="field"><label>Email</label><input id="email" data-in="email" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="username" value="${esc(S.email)}"></div>
    <div class="field"><label>Password</label>
      <div style="display:flex;gap:8px">
        <input id="password" type="${S.showPw ? 'text' : 'password'}" data-in="password" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="current-password" style="flex:1">
        <button class="btn" type="button" data-act="togglepw" style="padding:0 14px">${S.showPw ? 'Hide' : 'Show'}</button>
      </div>
    </div>
    ${S.loginErr ? `<p class="warn">${esc(S.loginErr)}</p>` : ''}
    <button class="btn primary" style="width:100%" data-act="login" ${S.saving ? 'disabled' : ''}>${S.saving ? 'Signing in…' : 'Sign in'}</button>
  </div></div>`,

  list: () => {
    const tv = S.gates.reduce((a, g) => a + Number(g.visitors_today), 0);
    const td = S.gates.reduce((a, g) => a + Number(g.deliveries_today), 0);
    const ti = S.gates.reduce((a, g) => a + Number(g.inside_now), 0);
    return `<div class="wrap">
      <header class="top"><span class="brand disp">Gateone<span>founder</span></span>
        <div class="topbtns">${themeBtn()}<button class="btn" data-act="signout">Sign out</button></div></header>

      ${healthBanner()}

      ${S.showTip ? `<div class="tip"><span>Tap any gate to see its real entries, generate a pairing code for a new tablet, or turn on demo data for a walkthrough. Demo data only shows here, never on the customer's tablet.</span><button data-act="dismisstip" aria-label="Dismiss">✕</button></div>` : ''}

      <div class="totals">
        <div class="tcard"><b>${tv}</b><span>Visitors today, all gates</span></div>
        <div class="tcard"><b>${td}</b><span>Deliveries today, all gates</span></div>
        <div class="tcard"><b>${ti}</b><span>Inside right now, all gates</span></div>
      </div>
      <p class="small" style="margin:0 0 4px">"Inside" counts visitors always, and deliveries only for gates that turned on delivery-exit tracking.</p>
      <p class="small" style="margin:0 0 18px">These numbers include demo data for any gate where you've switched it on.</p>
      <div class="gatesgrid">
        ${S.gates.map(g => `<div class="gatecard" data-act="opengate" data-arg="${esc(g.gate_id)}">
          <span class="tag ${g.plan}">${g.plan === 'premium' ? 'Premium' : 'Basic'}</span>
          <h3>${esc(g.community)}</h3>
          <div class="gatestats">
            <div><b>${g.visitors_today}</b><span>visitors</span></div>
            <div><b>${g.deliveries_today}</b><span>deliveries</span></div>
            <div><b>${g.inside_now}</b><span>inside</span></div>
          </div>
          <div class="viewhint">Open this gate →</div></div>`).join('')}
        <button class="gatecard addcard" data-act="newgate">+ New gate<br><span class="small" style="color:inherit">Creates it and gives you a pairing code right away</span></button>
      </div>

      <div class="panel"><h3>Alerts</h3>
        <p class="small" style="margin:0 0 14px">Gateone tests itself every hour: writes and reads a real database entry, and checks that both index.html and founder.html are actually live and not empty or broken. Results appear here whenever this page is open. Turning on notifications (below, or when Sign in prompts you) gives you an alert even if you're not looking at this tab, as long as it's open somewhere.</p>
        ${S.health.length ? S.health.map(h => `<div class="alertrow">
          <span>${new Date(h.checked_at).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>
          <span class="status"><i class="dot ${h.ok ? 'ok' : 'bad'}"></i>${h.ok ? 'OK' : 'Failed'}</span>
          <span>${esc(h.detail)}</span>
        </div>`).join('') : '<p class="empty">No checks recorded yet.</p>'}
        ${('Notification' in window && Notification.permission !== 'granted') ? `<button class="btn" style="margin-top:14px" data-act="notifyme">Turn on alert notifications</button>` : ''}
      </div>
    </div>`;
  },

  detail: () => {
    const d = S.detail; if (!d) return VIEWS.loading();
    const g = d.gate, isDemo = d.entries.some(e => e.demo);
    const real = d.entries.filter(e => !e.demo && !e.deletedAt);
    const trashed = d.entries.filter(e => !e.demo && e.deletedAt);
    const searchD = parseSearchDate(S.searchdate);
    const shownReal = searchD ? real.filter(e => sameDay(e.ts, searchD)) : real.slice().sort((a, b) => b.ts - a.ts).slice(0, 30);
    const sortedReal = searchD ? shownReal.slice().sort((a, b) => b.ts - a.ts) : shownReal;
    const rowHtml = e => `<tr><td>${new Date(e.ts).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</td><td>${e.type}</td><td>${esc(e.company || '')} ${esc(e.section || '')}${e.villa ? '-' + esc(e.villa) : ''}</td><td>${e.anonymized ? '<i>erased</i>' : (esc(e.name_en) || '–')}</td><td>${e.anonymized ? '<i>erased</i>' : (maskId(e.idn) || '–')}</td><td>${(e.carColor || e.plate) ? '🚗 ' + esc(e.carColor) + (e.plate ? ' · ' + esc(e.plate) : '') : '–'}</td><td><button class="btn" style="min-height:36px;padding:4px 12px;font-size:13px" data-act="deleteentry" data-arg="${esc(e.id)}">Delete</button></td></tr>`;
    return `<div class="wrap">
      <header class="top"><span class="brand disp">${esc(g.community)}<span>${g.plan === 'premium' ? 'Premium' : 'Basic'}</span></span>
        <div class="topbtns">${themeBtn()}<button class="btn" data-act="backlist">All gates</button></div></header>

      <div class="panel"><h3>Rename this gate</h3>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <input data-in="renamevalue" value="${esc(S.renamevalue)}" style="flex:1;min-width:200px;height:48px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--paper)">
          <button class="btn primary" data-act="renamegate" ${S.saving ? 'disabled' : ''}>${S.saving ? 'Saving…' : 'Save name'}</button>
        </div></div>

      <button class="demobtn ${isDemo ? 'on' : ''}" data-act="demotoggle" ${S.saving ? 'disabled' : ''}>
        <span><b>Demo data: ${S.saving ? 'Working…' : (isDemo ? 'ON' : 'OFF')}</b><br><span class="small" style="color:inherit">Only you can see or control this. Never shown to the customer's manager. Tap to turn ${isDemo ? 'off' : 'on'}.</span></span>
        <span style="font-size:22px">${isDemo ? '●' : '○'}</span>
      </button>
      <div class="panel"><h3>Pair a new tablet to this gate</h3>
        <p class="small" style="margin:0 0 12px">Generates a one-time code the tablet enters on its pairing screen.</p>
        <button class="btn primary" data-act="gencode">Generate pairing code</button></div>

      ${isDemo ? `<div class="panel" style="border-color:var(--gold)"><h3>Demo entries (${d.entries.filter(e => e.demo).length}) — not real, only visible to you</h3>
        <table><thead><tr><th>Time</th><th>Type</th><th>Where</th><th>Name</th><th>ID</th><th>Vehicle</th></tr></thead><tbody>
          ${d.entries.filter(e => e.demo).sort((a, b) => b.ts - a.ts).slice(0, 30).map(e => `<tr><td>${new Date(e.ts).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</td><td>${e.type}</td><td>${esc(e.company || '')} ${esc(e.section || '')}${e.villa ? '-' + esc(e.villa) : ''}</td><td>${esc(e.name_en) || '–'}</td><td>${maskId(e.idn) || '–'}</td><td>${(e.carColor || e.plate) ? '🚗 ' + esc(e.carColor) + (e.plate ? ' · ' + esc(e.plate) : '') : '–'}</td></tr>`).join('')}
        </tbody></table>
      </div>` : ''}

      <div class="panel"><h3>Real entries at this gate (${real.length})</h3>
        <div style="display:flex;gap:10px;margin:0 0 14px;flex-wrap:wrap">
          <input placeholder="Search a date, e.g. Sep 17" data-in="searchdate" value="${esc(S.searchdate)}" style="flex:1;min-width:200px;height:44px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--paper)">
          <button class="btn" data-act="runsearch">Search</button>
          ${S.searchdate ? `<button class="btn" data-act="clearsearch">Clear</button>` : ''}
          <button class="btn" style="color:var(--gold);border-color:var(--gold)" data-act="deleteallreal">Delete all real entries</button>
        </div>
        ${searchD ? `<p class="small" style="margin:0 0 14px">Showing ${sortedReal.length} ${sortedReal.length === 1 ? 'entry' : 'entries'} for ${searchD.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' })}.</p>` : ''}
        ${S.searchdate && !searchD ? `<p class="warn" style="margin:0 0 14px">Couldn't understand that date. Try something like "Sep 17" or "2026-09-17".</p>` : ''}
        ${sortedReal.length ? `<table><thead><tr><th>Time</th><th>Type</th><th>Where</th><th>Name</th><th>ID</th><th>Vehicle</th><th></th></tr></thead><tbody>
          ${sortedReal.map(rowHtml).join('')}
        </tbody></table>` : `<p class="small">${searchD ? 'No entries found for that date.' : 'Nothing real recorded yet at this gate.'}</p>`}
      </div>

      ${trashed.length ? `<div class="panel"><h3>Deleted (${trashed.length}) — still in the database, restore anytime</h3>
        <table><thead><tr><th>Time</th><th>Type</th><th>Where</th><th>Name</th><th>ID</th><th></th></tr></thead><tbody>
          ${trashed.slice().sort((a, b) => b.deletedAt - a.deletedAt).map(e => `<tr><td>${new Date(e.ts).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</td><td>${e.type}</td><td>${esc(e.company || '')} ${esc(e.section || '')}${e.villa ? '-' + esc(e.villa) : ''}</td><td>${esc(e.name_en) || '–'}</td><td>${maskId(e.idn) || '–'}</td><td><button class="btn" style="min-height:36px;padding:4px 12px;font-size:13px" data-act="restoreentry" data-arg="${esc(e.id)}">Restore</button></td></tr>`).join('')}
        </tbody></table>
      </div>` : ''}

      <div class="panel" style="border-color:var(--black)">
        <h3>Delete this gate</h3>
        <p class="small" style="margin:0 0 14px">This permanently deletes ${esc(g.community)} and every entry tied to it, real and demo, including anything in Deleted above. There is no undo, unlike deleting one entry. Type the gate's exact name to enable the button.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <input data-in="deleteconfirm" value="${esc(S.deleteconfirm)}" placeholder="${esc(g.community)}" style="flex:1;min-width:200px;height:48px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--paper)">
          <button class="btn" style="background:var(--black);color:var(--white);border-color:var(--black)" data-act="deletegate" ${S.saving ? 'disabled' : ''}>${S.saving ? 'Deleting…' : 'Delete gate permanently'}</button>
        </div>
      </div>
    </div>`;
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (b && !b.disabled) act(b.dataset.act, b.dataset.arg);
  if (e.target.closest('[data-close]')) { S.modal = null; render(); }
});
document.addEventListener('input', e => { const i = e.target.closest('[data-in]'); if (i) S[i.dataset.in] = i.value; });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-in="searchdate"]')) act('runsearch'); });

async function act(a, arg) {
  switch (a) {
    case 'togglepw': S.showPw = !S.showPw; render(); return;
    case 'theme': S.theme = S.theme === 'dark' ? 'light' : S.theme === 'light' ? 'auto' : 'dark'; try { localStorage.setItem('founder_theme', S.theme); } catch (e) {} render(); return;
    case 'notifyme': if ('Notification' in window) Notification.requestPermission().then(() => render()); return;
    case 'dismisstip': S.showTip = false; try { localStorage.setItem('founder_tip_seen', '1'); } catch (e) {} render(); return;
    case 'login': return doLogin();
    case 'signout': stopTimers(); await sb.auth.signOut(); S.screen = 'login'; render(); return;
    case 'opengate': return openGate(arg);
    case 'backlist': S.detail = null; await loadGates(); S.screen = 'list'; render(); return;
    case 'newgate': return newgate();
    case 'gencode': return genCode();
    case 'renamegate': return renameGate();
    case 'deletegate': return deleteGate();
    case 'deleteentry': return deleteEntry(arg);
    case 'deleteallreal': return deleteAllReal();
    case 'restoreentry': return restoreEntry(arg);
    case 'runsearch': render(); return;
    case 'clearsearch': S.searchdate = ''; render(); return;
    case 'demotoggle': return toggleDemo();
  }
}
async function doLogin() {
  S.loginErr = ''; S.saving = true; render();
  const { error } = await sb.auth.signInWithPassword({ email: S.email.trim(), password: S.password });
  S.saving = false;
  if (error) { S.loginErr = (error.message === 'Invalid login credentials' ? 'Wrong email or password.' : error.message) || 'Something went wrong.'; render(); return; }
  await checkOwnerAndLoad();
}
async function openGate(gateId) {
  S.screen = 'loading'; S.searchdate = ''; S.deleteconfirm = ''; render();
  const [{ data: gate, error: ge }, { data: entries, error: ee }] = await Promise.all([
    sb.from('gates').select('*').eq('id', gateId).single(),
    sb.from('entries').select('*').eq('gate_id', gateId).order('ts', { ascending: false }).limit(500)
  ]);
  if (ge || ee) { alert('Could not load this gate: ' + ((ge && ge.message) || (ee && ee.message))); S.screen = 'list'; render(); return; }
  S.detail = { gate, entries: (entries || []).map(r => ({ id: r.id, ts: new Date(r.ts).getTime(), type: r.type, company: r.company, section: r.section, villa: r.villa, name_en: r.name_en, idn: r.id_number || '', carColor: r.car_color || '', plate: r.plate_number || '', anonymized: r.anonymized, demo: r.demo, deletedAt: r.deleted_at ? new Date(r.deleted_at).getTime() : null })) };
  S.renamevalue = gate.community;
  S.screen = 'detail'; render();
}
async function renameGate() {
  const name = S.renamevalue.trim();
  if (!name) { alert('Enter a name first.'); return; }
  S.saving = true; render();
  const { error } = await sb.from('gates').update({ community: name }).eq('id', S.detail.gate.id);
  S.saving = false;
  if (error) { alert('Could not rename: ' + error.message); render(); return; }
  S.detail.gate.community = name;
  render();
}
async function deleteGate() {
  const g = S.detail.gate;
  if (S.deleteconfirm.trim() !== g.community) { alert('Type the gate\'s exact name, "' + g.community + '", to confirm.'); return; }
  if (!confirm('Really delete ' + g.community + ' and everything in it? This cannot be undone.')) return;
  S.saving = true; render();
  const { error } = await sb.from('gates').delete().eq('id', g.id);
  S.saving = false;
  if (error) { alert('Could not delete: ' + error.message); render(); return; }
  S.detail = null; S.deleteconfirm = '';
  await loadGates();
  S.screen = 'list'; render();
}
async function deleteEntry(id) {
  if (!confirm('Move this entry to Deleted? It stays in the database and you can restore it anytime.')) return;
  const { error } = await sb.from('entries').update({ deleted_at: new Date().toISOString() }).eq('id', id);
  if (error) { alert('Could not delete: ' + error.message); return; }
  const e = S.detail.entries.find(x => x.id === id); if (e) e.deletedAt = Date.now();
  render();
}
async function deleteAllReal() {
  const gid = S.detail.gate.id;
  if (!confirm('Move ALL real entries for this gate to Deleted? They stay in the database and you can restore them anytime. Demo data is not affected.')) return;
  const now = new Date().toISOString();
  const { error } = await sb.from('entries').update({ deleted_at: now }).eq('gate_id', gid).eq('demo', false).is('deleted_at', null);
  if (error) { alert('Could not delete: ' + error.message); return; }
  const t = Date.now();
  S.detail.entries.forEach(e => { if (!e.demo && !e.deletedAt) e.deletedAt = t; });
  render();
}
async function restoreEntry(id) {
  const { error } = await sb.from('entries').update({ deleted_at: null }).eq('id', id);
  if (error) { alert('Could not restore: ' + error.message); return; }
  const e = S.detail.entries.find(x => x.id === id); if (e) e.deletedAt = null;
  render();
}
async function newgate() {
  const name = prompt('Name for the new gate (e.g. "Damac Hills 2 – Verdes")');
  if (!name || !name.trim()) return;
  const { data: gate, error: ge } = await sb.from('gates').insert({ community: name.trim() }).select().single();
  if (ge) { alert('Could not create the gate: ' + ge.message); return; }
  const code = Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 33)]).join('');
  const { error: ce } = await sb.from('gate_pairing_codes').insert({ gate_id: gate.id, code });
  await loadGates(); render();
  if (ce) { alert('Gate created, but the pairing code failed: ' + ce.message + '\nOpen the gate and tap Generate pairing code instead.'); return; }
  alert(name.trim() + ' is set up.\n\nPairing code (valid 15 minutes): ' + code + '\n\nEnter this on the new tablet\'s pairing screen.');
}
async function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const code = Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
  const { error } = await sb.from('gate_pairing_codes').insert({ gate_id: S.detail.gate.id, code });
  if (error) { alert('Could not create a code.'); return; }
  alert('Pairing code (valid 15 minutes): ' + code + '\n\nEnter this on the tablet\'s pairing screen.');
}
async function toggleDemo() {
  const gid = S.detail.gate.id, isDemo = S.detail.entries.some(e => e.demo);
  S.saving = true; render();
  if (isDemo) {
    const { error } = await sb.from('entries').delete().eq('gate_id', gid).eq('demo', true);
    if (error) { S.saving = false; alert('Could not turn off demo data: ' + error.message); render(); return; }
  } else {
    const first = ['Ahmed','Omar','Sara','Khalid','Fatima','Yusuf','Layla','Hassan','Noor','Ali'];
    const last = ['Al Mansoori','Khan','Hussain','Al Nuaimi','Ahmed','Rahman','Ali','Al Suwaidi','Sharma','Ibrahim'];
    const colors = ['White','Black','Silver','Grey','Red','Blue'];
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const cos = (S.detail.gate.companies || ['Talabat', 'Noon']).filter(c => c !== 'Other');
    const secs = S.detail.gate.sections && S.detail.gate.sections.length ? S.detail.gate.sections : [''];
    const plate = () => (1000 + Math.floor(Math.random() * 90000)) + ' · ' + String.fromCharCode(65 + Math.floor(Math.random() * 26));
    const rows = [];
    for (let d = 6; d >= 0; d--) {
      const day = new Date(); day.setHours(0, 0, 0, 0); day.setDate(day.getDate() - d);
      for (let i = 0; i < 18; i++) {
        const noId = Math.random() < 0.15; // ~15% of drivers decline to show ID, matching real behaviour
        rows.push({ gate_id: gid, type: 'delivery', company: pick(cos), section: '', villa: '',
          name_en: noId ? '' : (pick(first) + ' ' + pick(last)).toUpperCase(),
          id_number: noId ? '' : '784' + Array.from({ length: 12 }, () => Math.floor(Math.random() * 10)).join(''),
          car_color: noId ? pick(colors) : '', plate_number: noId ? plate() : '',
          ts: new Date(day.getTime() + Math.random() * 12 * 3600e3 + 8 * 3600e3).toISOString(), demo: true });
      }
      for (let i = 0; i < 9; i++) rows.push({ gate_id: gid, type: 'visitor', company: '', section: pick(secs), villa: String(1 + Math.floor(Math.random() * 40)), name_en: (pick(first) + ' ' + pick(last)).toUpperCase(), id_number: '784' + Array.from({ length: 12 }, () => Math.floor(Math.random() * 10)).join(''), car_color: '', plate_number: '', ts: new Date(day.getTime() + Math.random() * 12 * 3600e3 + 8 * 3600e3).toISOString(), demo: true });
    }
    const { error } = await sb.from('entries').insert(rows);
    if (error) { S.saving = false; alert('Could not turn on demo data: ' + error.message); render(); return; }
  }
  const { data: entries, error: le } = await sb.from('entries').select('*').eq('gate_id', gid).order('ts', { ascending: false }).limit(500);
  S.saving = false;
  if (le) { alert('Demo data changed, but reloading the list failed: ' + le.message); render(); return; }
  S.detail.entries = (entries || []).map(r => ({ id: r.id, ts: new Date(r.ts).getTime(), type: r.type, company: r.company, section: r.section, villa: r.villa, name_en: r.name_en, idn: r.id_number || '', carColor: r.car_color || '', plate: r.plate_number || '', anonymized: r.anonymized, demo: r.demo, deletedAt: r.deleted_at ? new Date(r.deleted_at).getTime() : null }));
  render();
}

boot();
</script>
</body>
</html>
